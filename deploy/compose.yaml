# The whole application on the hosting VM. Deployed by hand for now:
#   docker compose pull && docker compose up -d
#
# Copy this file, Caddyfile, and a .env you create yourself into
# /opt/fragvault on the VM. See .env.example for what .env must contain.

name: fragvault

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only service published to the internet. Port 80 is not optional:
    # Caddy needs it for the ACME challenge that issues the certificate, and
    # for redirecting plain HTTP to HTTPS.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    image: ghcr.io/ferencovonmatterhorn/fragvault-frontend:latest
    restart: unless-stopped
    # No ports on purpose: reachable only from Caddy over the compose
    # network. Publishing it would expose an unencrypted second way in.
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  backend:
    image: ghcr.io/ferencovonmatterhorn/fragvault-backend:latest
    restart: unless-stopped
    # STEAM_WEB_API_KEY, SESSION_SECRET and BASE_URL. Never committed.
    env_file: .env
    volumes:
      - fragvault_data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Polls ghcr.io and redeploys the two application containers when a new
  # :latest is published, so a merge to main reaches the VM without an SSH
  # session.
  #
  # --label-enable means it only touches containers that opt in with the
  # label above. Caddy is deliberately left out: it holds the certificates
  # and is the only thing listening on 443, so it should not restart
  # unattended for a routine base-image bump.
  #
  # --cleanup deletes the superseded image after each update. Without it the
  # 30 GB OS disk slowly fills with every build ever deployed.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    command: --label-enable --cleanup --interval 300
    volumes:
      # Root-equivalent access to the host: anything that can talk to this
      # socket can start a privileged container. That is inherent to how
      # Watchtower works, and the reason it is scoped by label rather than
      # left to update everything.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  # Issued certificates and the ACME account key. Losing this means Caddy
  # re-requests certificates on the next start, and Let's Encrypt's rate
  # limits are low enough to lock you out for a week if that repeats.
  caddy_data:
  caddy_config:
  # Onboarded users, their Valve auth codes, and discovered matches. This is
  # the only stateful thing in the deployment — back it up before rebuilding
  # the VM.
  fragvault_data:
