# The whole application on the hosting VM. Deployed by hand for now:
#   docker compose pull && docker compose up -d
#
# Copy this file, Caddyfile, and a .env you create yourself into
# /opt/fragvault on the VM. See .env.example for what .env must contain.

name: fragvault

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only service published to the internet. Port 80 is not optional:
    # Caddy needs it for the ACME challenge that issues the certificate, and
    # for redirecting plain HTTP to HTTPS.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    image: ghcr.io/ferencovonmatterhorn/fragvault-frontend:latest
    restart: unless-stopped
    # No ports on purpose: reachable only from Caddy over the compose
    # network. Publishing it would expose an unencrypted second way in.
    labels:
      # Opt in to auto-update. digest matters because the tag is :latest,
      # whose name never changes — only the digest behind it does, so there
      # is no version number for WUD to compare.
      wud.watch: "true"
      wud.watch.digest: "true"

  backend:
    image: ghcr.io/ferencovonmatterhorn/fragvault-backend:latest
    restart: unless-stopped
    # STEAM_WEB_API_KEY, SESSION_SECRET and BASE_URL. Never committed.
    env_file: .env
    volumes:
      - fragvault_data:/data
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"

  # What's Up Docker: watches ghcr.io and recreates the two application
  # containers when a new image is published, so a merge to main reaches the
  # VM without an SSH session.
  #
  # This replaced Watchtower, whose upstream (containrrr/watchtower) is
  # archived and shipped a Docker API client so old that current daemons
  # refuse it outright ("client version 1.25 is too old").
  #
  # Pinned to a major tag rather than :latest — an auto-updater that silently
  # updates itself is the one container where a surprise is least welcome.
  wud:
    image: getwud/wud:8
    restart: unless-stopped
    environment:
      # Watch nothing unless it opts in via wud.watch below. Caddy stays out
      # deliberately: it holds the certificates and is the only thing
      # listening on 443, so it should not restart unattended.
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "false"
      WUD_WATCHER_LOCAL_CRON: "*/5 * * * *"
      # Apply updates rather than only reporting them, and delete the
      # superseded image afterwards — without pruning, every build ever
      # deployed accumulates on a 30 GB disk.
      WUD_TRIGGER_DOCKER_LOCAL_AUTO: "true"
      WUD_TRIGGER_DOCKER_LOCAL_PRUNE: "true"
    volumes:
      # Root-equivalent access to the host: anything that can talk to this
      # socket can start a privileged container. That is inherent to any
      # auto-updater, and the reason watching is opt-in per container.
      - /var/run/docker.sock:/var/run/docker.sock
    # WUD serves a web UI on 3000. Deliberately not published — it would be a
    # second, unauthenticated way into the host's Docker socket.

volumes:
  # Issued certificates and the ACME account key. Losing this means Caddy
  # re-requests certificates on the next start, and Let's Encrypt's rate
  # limits are low enough to lock you out for a week if that repeats.
  caddy_data:
  caddy_config:
  # Onboarded users, their Valve auth codes, and discovered matches. This is
  # the only stateful thing in the deployment — back it up before rebuilding
  # the VM.
  fragvault_data:
