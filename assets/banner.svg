<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="FragVault — every ace, clutch and opening pick in your CS2 matches">
  <title>FragVault</title>

  <defs>
    <style>
      /* IBM Plex Condensed is what the app itself uses; viewers without it
         fall back to whatever condensed face they have. Letter-spacing and
         case carry the character either way. */
      .display { font-family: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: 700; letter-spacing: 0.06em; }
      .body { font-family: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Gunmetal, not black: a surface with weight rather than an absence. -->
  <rect width="1200" height="320" rx="16" fill="#191c21"/>

  <g class="display">
    <text x="72" y="140" font-size="82" fill="#e7eaee">FRAGVAULT</text>
  </g>

  <text class="body" x="76" y="182" font-size="23" fill="#98a0ac">
    Every ace, clutch and opening pick in your CS2 matches.
  </text>

  <!-- The round strip: the app's signature element, and the one thing here
       a CS player recognises instantly. Blue won, amber won, the gap is the
       half. -->
  <g>
    <rect x="76" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="93" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="110" y="222" width="11" height="26" rx="2" fill="#d8a03d"/>
    <rect x="127" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="144" y="222" width="11" height="26" rx="2" fill="#d8a03d"/>
    <rect x="161" y="222" width="11" height="26" rx="2" fill="#d8a03d"/>
    <rect x="178" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="195" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="212" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="229" y="222" width="11" height="26" rx="2" fill="#d8a03d"/>
    <rect x="246" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="263" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <!-- half time -->
    <rect x="292" y="222" width="11" height="26" rx="2" fill="#d8a03d"/>
    <rect x="309" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="326" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="343" y="222" width="11" height="26" rx="2" fill="#d8a03d"/>
    <rect x="360" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="377" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="394" y="222" width="11" height="26" rx="2" fill="#d8a03d"/>
    <rect x="411" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
    <rect x="428" y="222" width="11" height="26" rx="2" fill="#5b9be0"/>
  </g>

  <text class="mono" x="76" y="278" font-size="15" fill="#5b9be0">fragvault.pro</text>
  <text class="mono" x="200" y="278" font-size="15" fill="#98a0ac">Go · React · Postgres · Azure</text>

  <!-- Two-tone rule rather than a gradient: the two sides, again. -->
  <rect x="0" y="308" width="600" height="12" fill="#5b9be0"/>
  <rect x="600" y="308" width="600" height="12" fill="#d8a03d"/>
</svg>
