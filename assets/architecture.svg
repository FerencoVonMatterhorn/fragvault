<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" role="img" aria-label="FragVault deployment: browser to Caddy, which routes to the frontend and backend containers on one Azure VM">
  <title>FragVault deployment topology</title>

  <defs>
    <style>
      .f { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .box { fill: #141f36; stroke: #2b3a58; stroke-width: 1.5; }
      .h { font-size: 19px; font-weight: 600; fill: #e8eef7; }
      .s { font-size: 13px; fill: #93a4c0; }
      .lbl { font-size: 12.5px; fill: #ffb37a; }
      .flow { stroke: #4f6a99; stroke-width: 2; fill: none; }
      .ext { stroke: #3f5477; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f6a99"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3f5477"/>
    </marker>
  </defs>

  <rect width="1060" height="640" rx="14" fill="#0b1220"/>

  <g class="f">
    <text x="34" y="46" font-size="20" font-weight="700" fill="#f8fafc">FragVault — how it runs</text>
    <text x="34" y="70" class="s">Phase 1: one small VM, three containers, everything behind Caddy</text>

    <!-- Browser -->
    <g>
      <rect x="30" y="258" width="164" height="104" rx="12" class="box"/>
      <text x="112" y="298" text-anchor="middle" class="h">Browser</text>
      <text x="112" y="322" text-anchor="middle" class="s m">fragvault.pro</text>
      <text x="112" y="342" text-anchor="middle" class="s">session cookie</text>
    </g>

    <!-- The VM -->
    <rect x="246" y="104" width="566" height="466" rx="16" fill="#0e182b" stroke="#2b3a58" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="270" y="136" font-size="15" font-weight="600" fill="#c7d3e6">Azure VM · swedencentral</text>
    <text x="270" y="157" class="s m">Standard_B2ats_v2 · Docker Compose</text>

    <!-- Caddy -->
    <g>
      <rect x="278" y="256" width="180" height="128" rx="12" class="box"/>
      <text x="368" y="292" text-anchor="middle" class="h">Caddy</text>
      <text x="368" y="315" text-anchor="middle" class="s m">:80 · :443</text>
      <text x="368" y="337" text-anchor="middle" class="s">TLS, auto-renewed</text>
      <text x="368" y="359" text-anchor="middle" class="s m">vol: caddy_data</text>
    </g>

    <!-- Frontend -->
    <g>
      <rect x="530" y="176" width="248" height="112" rx="12" class="box"/>
      <text x="654" y="212" text-anchor="middle" class="h">frontend</text>
      <text x="654" y="236" text-anchor="middle" class="s">nginx · built SPA</text>
      <text x="654" y="258" text-anchor="middle" class="s">static only, no proxy</text>
    </g>

    <!-- Backend -->
    <g>
      <rect x="530" y="374" width="248" height="112" rx="12" class="box"/>
      <text x="654" y="410" text-anchor="middle" class="h">backend</text>
      <text x="654" y="434" text-anchor="middle" class="s m">Go · :8080</text>
      <text x="654" y="456" text-anchor="middle" class="s">stdlib only, no deps</text>
    </g>

    <!-- Volume -->
    <g>
      <ellipse cx="654" cy="518" rx="66" ry="12" fill="#182740" stroke="#2b3a58"/>
      <path d="M588 518 v22 a66 12 0 0 0 132 0 v-22" fill="#182740" stroke="#2b3a58"/>
      <text x="654" y="566" text-anchor="middle" class="s m">fragvault_data</text>
    </g>

    <!-- Steam -->
    <g>
      <rect x="866" y="374" width="164" height="112" rx="12" class="box"/>
      <text x="948" y="410" text-anchor="middle" class="h">Steam</text>
      <text x="948" y="434" text-anchor="middle" class="s">OpenID login</text>
      <text x="948" y="456" text-anchor="middle" class="s">Web API · matches</text>
    </g>

    <!-- Registry -->
    <g>
      <rect x="866" y="176" width="164" height="112" rx="12" class="box"/>
      <text x="948" y="212" text-anchor="middle" class="h">ghcr.io</text>
      <text x="948" y="236" text-anchor="middle" class="s">images built by</text>
      <text x="948" y="258" text-anchor="middle" class="s">GitHub Actions</text>
    </g>
  </g>

  <!-- Flows -->
  <g>
    <path d="M194 310 H278" class="flow" marker-end="url(#a)"/>
    <text x="236" y="300" text-anchor="middle" class="f lbl m">https</text>

    <path d="M458 296 C 496 296, 500 232, 530 232" class="flow" marker-end="url(#a)"/>
    <text x="500" y="196" text-anchor="middle" class="f lbl">everything else</text>

    <path d="M458 344 C 496 344, 500 430, 530 430" class="flow" marker-end="url(#a)"/>
    <text x="498" y="368" text-anchor="middle" class="f lbl m">/api/* · /auth/*</text>

    <path d="M778 430 H866" class="flow" marker-end="url(#a)"/>
    <text x="822" y="420" text-anchor="middle" class="f lbl">API key</text>

    <path d="M654 486 V 506" class="flow" marker-end="url(#a)"/>

    <path d="M866 232 H 800" class="ext" marker-end="url(#ad)"/>
    <text x="833" y="222" text-anchor="middle" class="f s m">pull</text>
  </g>

  <text x="34" y="612" class="f s">Terraform provisions the VM and network. The state account and this deployment are managed outside it.</text>
</svg>
