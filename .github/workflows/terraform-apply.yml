name: Terraform Apply

# Manual by design. terraform-plan.yml runs automatically on PRs and on
# merge to main, so there's always a fresh plan to read before anyone
# triggers this. Applying stays a deliberate act: Actions tab -> Terraform
# Apply -> Run workflow.
#
# There is no auto_approve input. There used to be one, and it did nothing —
# the job always applied. The real gates are this manual trigger and the
# environment's required reviewers.
on:
  workflow_dispatch:

# Shared with terraform-plan.yml: Terraform locks the state blob, so a plan
# running concurrently with this would fail on the lock. Never cancel in
# progress — an interrupted apply can leave state and reality out of sync.
concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  terraform:
    name: terraform plan/apply
    runs-on: ubuntu-latest
    # Set up a "production" environment in repo Settings → Environments with
    # required reviewers to add a human approval click on top of the manual
    # trigger. Without that environment configured, this manual trigger is
    # the only gate.
    environment: production
    defaults:
      run:
        working-directory: infrastructure
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.HOSTING_VM_SSH_PUBLIC_KEY }}
      TF_VAR_allowed_ssh_source_ip: ${{ secrets.ADMIN_SOURCE_IP_CIDR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Remote state backend is configured in providers.tf and authenticates
      # with the ARM_* service principal above — no storage access key secret.
      - run: terraform init -input=false

      # Re-planned here rather than reusing the plan file from
      # terraform-plan.yml. Plan files embed sensitive attribute values, so
      # passing one between workflows as an artifact would leak them, and a
      # stale plan can no longer be applied if state moved underneath it.
      - run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -auto-approve tfplan
