name: Backend

# Split out of a single CI workflow so a frontend-only or infra-only change
# doesn't run Go builds. Path filters apply per workflow, not per job, which
# is why this isn't one file with three jobs.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: gofmt -l . | tee /tmp/gofmt.out && [ ! -s /tmp/gofmt.out ]
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v
