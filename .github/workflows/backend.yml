name: Backend

# Split out of a single CI workflow so a frontend-only or infra-only change
# doesn't run Go builds. Path filters apply per workflow, not per job, which
# is why this isn't one file with three jobs.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read
  packages: write # to push the image to ghcr.io

jobs:
  test:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The persistence layer is only meaningfully testable against real
    # Postgres — migrations, the uniqueness constraint that prevents
    # re-analysis, and transactional appends don't exist without one. The
    # tests skip when TEST_DATABASE_URL is unset, so local runs stay simple.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fragvault_test
          POSTGRES_USER: fragvault
          POSTGRES_PASSWORD: fragvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fragvault -d fragvault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://fragvault:fragvault@localhost:5432/fragvault_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: gofmt -l . | tee /tmp/gofmt.out && [ ! -s /tmp/gofmt.out ]
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v

  image:
    name: Build image (pushed on main)
    # Only ship what passes. The Dockerfile compiles the binary again, but a
    # failing test should stop an image from reaching the registry at all.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tag
        run: |
          # ghcr rejects uppercase in the registry path, and this owner has
          # capitals in it.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/fragvault-backend" >> "$GITHUB_ENV"
          # Immutable tag alongside :latest, so a bad deploy can be rolled
          # back to an exact commit.
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image
        working-directory: backend
        run: docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      # Pull requests build but never publish: a PR from a fork must not be
      # able to put an image under this repo's name.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$TAG and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
