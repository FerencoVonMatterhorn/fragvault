name: GC sidecar

# See backend.yml for why this is a separate workflow rather than a job.
on:
  push:
    branches: [main]
    paths:
      - "gc-sidecar/**"
      - ".github/workflows/gc-sidecar.yml"
  pull_request:
    paths:
      - "gc-sidecar/**"
      - ".github/workflows/gc-sidecar.yml"

permissions:
  contents: read
  packages: write # to push the image to ghcr.io

jobs:
  image:
    name: Build image (pushed on main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tag
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/fragvault-gc-sidecar" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # There is no test suite here — the service is a protocol adapter whose
      # only real dependency is a live Steam session, which CI has no business
      # holding credentials for. A syntax check catches the class of mistake
      # that would otherwise only show up as a crash-looping container.
      - name: Syntax check
        working-directory: gc-sidecar
        run: node --check index.js

      - name: Build image
        working-directory: gc-sidecar
        run: docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$TAG and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
