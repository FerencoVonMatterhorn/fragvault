name: Frontend

# See backend.yml for why this is a separate workflow rather than a job.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read
  packages: write # to push the image to ghcr.io

jobs:
  image:
    name: Build image (pushed on main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tag
        run: |
          # ghcr rejects uppercase in the registry path, and this owner has
          # capitals in it.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/fragvault-frontend" >> "$GITHUB_ENV"
          # Immutable tag alongside :latest, so a bad deploy can be rolled
          # back to an exact commit.
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # The Dockerfile is the only build definition — it runs tsc and vite in
      # its build stage, so a type error fails here exactly as a separate npm
      # job would have. Two ways to build one artifact is one too many.
      - name: Build image
        working-directory: frontend
        run: docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      # Pull requests build but never publish: a PR from a fork must not be
      # able to put an image under this repo's name.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$TAG and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
